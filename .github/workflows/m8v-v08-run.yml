name: M8V V08 deterministic runner

on:
  push:
    branches:
      - m8v-vessel-identification-evidence
    paths:
      - .github/workflows/m8v-v08-run.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8v-vessel-identification-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Apply deterministic TASK-V08 patch
        run: python tools/m8v_v08_finalize_patch.py
      - name: Apply TypeScript fail-closed patch
        run: python tools/m8v_v08_ts_fix.py
      - name: Repair V04 schema for Ajv strictTypes
        run: python tools/m8v_v04_schema_strict_fix.py
      - name: Build initial fail-closed evidence ledger
        run: >-
          python authoring/review/m8v_build_evidence_ledger.py
          --radial authoring/outputs/m8v-v05-radial-artery-identity-evidence-20260911.json
          --superficial authoring/outputs/m8v-v06-superficial-venous-network-evidence-20260911.json
          --review-surface authoring/outputs/m8v-v07-multimodal-review-surface-20260911.json
          --tracks authoring/outputs/m8v-v04-candidate-vessel-track-graph-20260910.json
          --landmarks authoring/outputs/m8v-v03-upper-extremity-landmark-graph-20260910.json
          --recorded-at 2026-09-11
          --output authoring/outputs/m8v-v08-evidence-ledger-20260911.json
      - name: Format TASK-V08 artifacts
        run: >-
          pnpm exec prettier --write
          apps/web/src/M8VAdjudication.tsx
          schemas/assets/m8v-candidate-vessel-track-graph.v1.schema.json
          schemas/assets/m8v-human-adjudication-session.v1.schema.json
          schemas/assets/m8v-evidence-ledger.v1.schema.json
          authoring/outputs/m8v-v08-evidence-ledger-20260911.json
          tools/validate-schemas.mjs
          .github/workflows/pages.yml
      - name: Run TASK-V08 tests
        run: python authoring/source-acquisition/tests/test_m8v_evidence_ledger.py
      - name: Validate schemas
        run: pnpm schema:validate
      - name: Typecheck web
        run: pnpm --filter @procedural-human/web typecheck
      - name: Build web
        run: pnpm --filter @procedural-human/web build
      - name: Verify fail-closed initial state
        run: >-
          python -c "import json,pathlib; r=json.loads(pathlib.Path('authoring/outputs/m8v-v08-evidence-ledger-20260911.json').read_text()); assert len(r['claims'])==15; assert not r['humanReviewSessions']; assert all(c['humanReviewStatus']=='not-reviewed' and c['humanReviewTargetId'] is None for c in r['claims']); assert r['decision']['ledgerState']=='blocked-unresolved'; assert not r['decision']['radialPromotionReady']; assert not r['decision']['superficialStructurePromotionReady']; assert not r['decision']['namedSuperficialPromotionReady']; assert not r['assertions']['medicalValidation']; assert not r['assertions']['patientSpaceGeometry']; assert not r['assertions']['procedureRoleEstablished']; assert not r['assertions']['automaticPromotionAllowed']"
      - name: Commit TASK-V08 finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/review/m8v_build_evidence_ledger.py
          git add authoring/source-acquisition/tests/test_m8v_evidence_ledger.py
          git add apps/web/src/M8VAdjudication.tsx
          git add schemas/assets/m8v-candidate-vessel-track-graph.v1.schema.json
          git add schemas/assets/m8v-human-adjudication-session.v1.schema.json
          git add schemas/assets/m8v-evidence-ledger.v1.schema.json
          git add authoring/outputs/m8v-v08-evidence-ledger-20260911.json
          git add tools/validate-schemas.mjs
          git add .github/workflows/pages.yml
          git commit -m "TASK-V08: finalize fail-closed evidence ledger"
          git push origin HEAD:m8v-vessel-identification-evidence
