name: Prepare TASK-036-038

on:
  push:
    branches:
      - task-036-038-spatial-queries

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-036-038-spatial-queries
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/spatial/package.json packages/spatial/src/index.ts tests/spatial-query.test.mjs
      - name: Commit preparation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml packages/spatial/package.json packages/spatial/src/index.ts tests/spatial-query.test.mjs
          git commit -m "chore: prepare TASK-036-038 spatial queries"
          git push origin HEAD:task-036-038-spatial-queries
