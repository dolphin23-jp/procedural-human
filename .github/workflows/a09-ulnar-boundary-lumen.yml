name: A09 ulnar boundary lumen candidate

on:
  push:
    branches:
      - task-a09-ulnar-boundary-lumen-v0
    paths:
      - .github/workflows/a09-ulnar-boundary-lumen.yml
      - authoring/source-acquisition/a09_build_ulnar_boundary_lumen.py
      - schemas/assets/a09-boundary-lumen-candidate.v1.schema.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check             numpy==2.2.6             opencv-python-headless==4.12.0.88             Pillow==11.3.0             jsonschema==4.25.1

      - name: Download verified bounded continuous ulnar segment
        run: |
          mkdir -p build/continuous
          curl --fail --location --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10092590748/zip"             -o build/a06-a08-ulnar-continuous.zip
          test "$(wc -c < build/a06-a08-ulnar-continuous.zip)" = "80834"
          test "$(sha256sum build/a06-a08-ulnar-continuous.zip | awk '{print $1}')" = "9eadd9a355ebee59eb5dbe59fa0540a227291951f80a9190d4c5f5a5981a7d75"
          unzip -q build/a06-a08-ulnar-continuous.zip -d build/continuous
          test -f build/continuous/a06-ulnar-continuous-segment-report.v0.json
          test -f build/continuous/a08-ulnar-source-stack-centerline-v0.json
          test "$(find build/continuous/masks/ulnar_artery -name '*.pgm' | wc -l)" = "106"

      - name: Build bounded A09 boundary/lumen candidate
        run: |
          python authoring/source-acquisition/a09_build_ulnar_boundary_lumen.py             --continuous-root build/continuous             --output-root build/a09

      - name: Validate A09 candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root=Path("build/a09")
          report=json.loads((root/"a09-ulnar-boundary-lumen-v0.json").read_text())
          schema=json.loads(Path("schemas/assets/a09-boundary-lumen-candidate.v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(report)

          assert report["status"] == "generated-v0-candidate"
          assert report["support"]["frameCount"] == 106
          assert report["support"]["firstSourceFilename"] == "avf1646a.png"
          assert report["support"]["lastSourceFilename"] == "avf1681a.png"
          topology=report["topologyValidation"]
          assert topology["singleConnectedLumenComponentEveryFrame"] is True
          assert topology["closedOuterBoundaryEveryFrame"] is True
          assert topology["correctedCenterlinePointInsideLumenEveryFrame"] is True
          diagnostic=report["sourceCenterlineDiagnostic"]
          assert diagnostic["maxInputToCorrectedCenterlineDistancePixels"] <= 6
          assert diagnostic["maxCorrectedCenterlineJumpPixels"] <= 6
          assert topology["consecutiveFrameCoverage"] is True
          assert report["semantics"]["anatomicalWallThicknessClaim"] is False
          assert report["claims"]["medicalValidation"] is False
          assert report["claims"]["patientSpaceGeometry"] is False
          assert report["claims"]["runtimeRepresentation"] is False
          corrected_centerline=json.loads((root/"a08-ulnar-lumen-centered-source-stack-centerline-v0.json").read_text())
          corrected_schema=json.loads(Path("schemas/assets/a08-source-stack-centerline-candidate.v1.schema.json").read_text())
          Draft202012Validator.check_schema(corrected_schema)
          Draft202012Validator(corrected_schema).validate(corrected_centerline)
          assert corrected_centerline["support"]["pointCount"] == 106
          assert len(corrected_centerline["points"]) == 106

          assert len(report["frames"]) == 106
          assert len(list((root/"lumen"/"ulnar_artery").glob("*.pgm"))) == 106
          assert len(list((root/"boundary"/"ulnar_artery").glob("*.pgm"))) == 106

          print(json.dumps({
              "support": report["support"],
              "topologyValidation": topology,
              "summary": report["summary"],
              "sourceCenterlineDiagnostic": report["sourceCenterlineDiagnostic"],
              "claims": report["claims"],
          },indent=2))
          PY

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: a09-ulnar-boundary-lumen-v0
          path: build/a09/
          compression-level: 9
          retention-days: 30

      - name: Record artifact identity
        run: |
          echo "artifact-id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact-digest=${{ steps.upload.outputs.artifact-digest }}"
