name: M8V V07 format helper

on:
  push:
    branches:
      - m8v-vessel-identification-evidence
    paths:
      - .github/workflows/m8v-v07-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8v-vessel-identification-evidence

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format V07 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/M8VReview.tsx \
            schemas/assets/m8v-multimodal-review-surface.v1.schema.json

      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/M8VReview.tsx \
            schemas/assets/m8v-multimodal-review-surface.v1.schema.json
          if ! git diff --cached --quiet; then
            git commit -m "TASK-V07: format review surface"
            git push origin HEAD:m8v-vessel-identification-evidence
          fi
