name: A06 vessel schema format helper

on:
  push:
    branches:
      - task-a06-vessel-atlas-priors
    paths:
      - .github/workflows/a06-vessel-schema-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write schemas/assets/a06-source-evidence-vessel-candidate-report.v1.schema.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/assets/a06-source-evidence-vessel-candidate-report.v1.schema.json
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "chore: format A06 vessel candidate schema"
            git push
          fi
