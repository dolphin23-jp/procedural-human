name: M8V TASKS patch

on:
  push:
    branches:
      - m8v-vessel-identification-evidence
    paths:
      - .github/workflows/m8v-tasks-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8v-vessel-identification-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/patch-m8v-tasks.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASKS.md
          git commit -m "TASK-V07: formalize M8V governance in task plan"
          git push origin HEAD:m8v-vessel-identification-evidence
