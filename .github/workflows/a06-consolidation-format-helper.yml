name: A06 consolidation format helper

on:
  push:
    branches:
      - task-a06-source-evidence-consolidation
    paths:
      - .github/workflows/a06-consolidation-format-helper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format A06 consolidation files
        run: |
          pnpm exec prettier --write \
            authoring/manual-inputs/a06-manual-correction-status-20260909.json \
            authoring/outputs/a06-vessel-source-diagnostic-provenance-20260909.json \
            authoring/semantic/a07-semantic-structure-mapping-20260909.json \
            authoring/outputs/a10-medical-master-readiness-20260909.json \
            authoring/slicer/A06_MANUAL_CORRECTION.md \
            schemas/assets/a06-superficial-vessel-source-discovery.v1.schema.json \
            .github/workflows/a06-radial-source-refinement.yml \
            .github/workflows/a06-superficial-vessel-source-discovery.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            authoring/manual-inputs/a06-manual-correction-status-20260909.json \
            authoring/outputs/a06-vessel-source-diagnostic-provenance-20260909.json \
            authoring/semantic/a07-semantic-structure-mapping-20260909.json \
            authoring/outputs/a10-medical-master-readiness-20260909.json \
            authoring/slicer/A06_MANUAL_CORRECTION.md \
            schemas/assets/a06-superficial-vessel-source-discovery.v1.schema.json \
            .github/workflows/a06-radial-source-refinement.yml \
            .github/workflows/a06-superficial-vessel-source-discovery.yml
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "chore: format A06 consolidation files"
            git push
          fi
