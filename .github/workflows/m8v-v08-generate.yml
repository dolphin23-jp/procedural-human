name: M8V V08 evidence ledger generator

on:
  push:
    branches:
      - m8v-vessel-identification-evidence
    paths:
      - .github/workflows/m8v-v08-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8v-vessel-identification-evidence

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run TASK-V08 tests
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python authoring/source-acquisition/tests/test_m8v_evidence_ledger.py

      - name: Build initial fail-closed evidence ledger
        run: |
          python authoring/review/m8v_build_evidence_ledger.py \
            --radial authoring/outputs/m8v-v05-radial-artery-identity-evidence-20260911.json \
            --superficial authoring/outputs/m8v-v06-superficial-venous-network-evidence-20260911.json \
            --review-surface authoring/outputs/m8v-v07-multimodal-review-surface-20260911.json \
            --tracks authoring/outputs/m8v-v04-candidate-vessel-track-graph-20260910.json \
            --landmarks authoring/outputs/m8v-v03-upper-extremity-landmark-graph-20260910.json \
            --recorded-at 2026-09-11 \
            --output authoring/outputs/m8v-v08-evidence-ledger-20260911.json

      - name: Format and validate TASK-V08 contracts
        run: |
          pnpm exec prettier --write \
            schemas/assets/m8v-human-adjudication-session.v1.schema.json \
            schemas/assets/m8v-evidence-ledger.v1.schema.json \
            authoring/outputs/m8v-v08-evidence-ledger-20260911.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('schemas/assets/m8v-evidence-ledger.v1.schema.json').read_text())
          record = json.loads(Path('authoring/outputs/m8v-v08-evidence-ledger-20260911.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(record)
          assert len(record['claims']) == 15
          assert record['humanReviewSessions'] == []
          assert record['decision'] == {
              'ledgerState': 'blocked-unresolved',
              'humanAdjudicationEvidencePresent': False,
              'radialPromotionReady': False,
              'superficialStructurePromotionReady': False,
              'namedSuperficialPromotionReady': False,
              'nextTask': 'TASK-V09',
          }
          assert record['assertions']['automaticPromotionAllowed'] is False
          PY

      - name: Commit deterministic TASK-V08 output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/assets/m8v-human-adjudication-session.v1.schema.json \
            schemas/assets/m8v-evidence-ledger.v1.schema.json \
            authoring/outputs/m8v-v08-evidence-ledger-20260911.json
          git commit -m "TASK-V08: record initial fail-closed evidence ledger"
          git push origin HEAD:m8v-vessel-identification-evidence
