name: Probe VHP female CT

on:
  push:
    branches:
      - task-a06-atlas-assisted-correction
    paths:
      - .github/workflows/probe-vhp-female-ct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Denver data downloads with browser-like session
        run: |
          set -euxo pipefail
          PAGE='https://digitalcommons.du.edu/visiblehuman/1/'
          META='https://digitalcommons.du.edu/cgi/viewcontent.cgi?article=1001&context=visiblehuman&filename=11&type=additional'
          CT='https://digitalcommons.du.edu/cgi/viewcontent.cgi?article=1001&context=visiblehuman&filename=1&type=additional'

          curl -L -A 'Mozilla/5.0' -c /tmp/cookies.txt -o /tmp/page.html "$PAGE"
          wc -c /tmp/page.html

          for URL in "$META" "$CT"; do
            echo "PROBE $URL"
            curl -L -A 'Mozilla/5.0' -b /tmp/cookies.txt -e "$PAGE" \
              --range 0-65535 -D /tmp/headers.txt -o /tmp/probe.bin "$URL" || true
            cat /tmp/headers.txt
            wc -c /tmp/probe.bin || true
            file /tmp/probe.bin || true
            head -c 200 /tmp/probe.bin | xxd || true
          done
