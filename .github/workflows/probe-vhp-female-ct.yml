name: Probe VHP female CT

on:
  push:
    branches:
      - task-a06-atlas-assisted-correction
    paths:
      - .github/workflows/probe-vhp-female-ct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe radiological metadata and likely files
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen

          base="https://data.lhncbc.nlm.nih.gov/public/Visible-Human/Female-Images/Radiological"
          candidates=[
            "README","README.txt",
            "CT/README","CT/README.txt","ct/README","ct/README.txt",
            "MRI/README","MRI/README.txt","mri/README","mri/README.txt",
            "ct001.png","ct0001.png","f_ct001.png","fct001.png",
            "CT/ct001.png","CT/ct0001.png","CT/f_ct001.png","CT/fct001.png",
          ]
          for name in candidates:
            url=f"{base}/{name}"
            try:
              req=Request(url,headers={"User-Agent":"procedural-human-authoring/0.0 (+probe)"})
              with urlopen(req,timeout=30) as r:
                head=r.read(16000)
                print("\nOK",r.status,r.headers.get("Content-Type"),len(head),url)
                print(head.decode("utf-8","replace")[:12000])
            except Exception as e:
              print("ERR",url,type(e).__name__,e)
          PY
