name: A06 vessel atlas priors

on:
  push:
    branches:
      - task-a06-vessel-atlas-priors
    paths:
      - .github/workflows/a06-vessel-atlas-priors.yml
      - authoring/source-acquisition/a06_build_vessel_atlas_priors.py
      - schemas/assets/a06-vessel-atlas-prior-report.v1.schema.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 jsonschema==4.25.1

      - name: Download verified radius/ulna candidate package
        run: |
          mkdir -p build/bones
          curl --fail --location --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10088808577/zip"             -o build/a06-bones.zip
          test "$(wc -c < build/a06-bones.zip)" = "664033"
          test "$(sha256sum build/a06-bones.zip | awk '{print $1}')" = "407ca0dee7ef99dca8f408195159dca377342376f873c3611b4409b264ab724b"
          unzip -q build/a06-bones.zip -d build/bones
          test -f build/bones/a06-multimodality-bone-candidate-report.v0.json

      - name: Download verified Z-Anatomy forearm reference
        run: |
          mkdir -p build/zref
          curl --fail --location --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10081007930/zip"             -o build/zref.zip
          test "$(wc -c < build/zref.zip)" = "196995"
          test "$(sha256sum build/zref.zip | awk '{print $1}')" = "9b1c58de04f78e533e2d339f4ad6d3d93dc32d9f74c5d14d6c816b3cab2aa625"
          unzip -q build/zref.zip -d build/zref
          for f in radius ulna radial_artery ulnar_artery cephalic_vein basilic_vein; do
            test -s "build/zref/$f.ply"
          done

      - name: Build cross-atlas vessel search priors
        run: |
          python authoring/source-acquisition/a06_build_vessel_atlas_priors.py             --bone-report build/bones/a06-multimodality-bone-candidate-report.v0.json             --atlas-root build/zref             --output-root build/vessel-priors

      - name: Validate prior report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report_path=Path("build/vessel-priors/a06-vessel-atlas-prior-report.v0.json")
          schema_path=Path("schemas/assets/a06-vessel-atlas-prior-report.v1.schema.json")
          report=json.loads(report_path.read_text())
          schema=json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(report)

          direct=report["registration"]["direct"]
          assert direct["meanResidualSourcePixels"] < 25
          assert direct["proximalAtlasZ"] > direct["distalAtlasZ"]
          assert report["support"]["supportedFrameCount"] == 355
          assert len(report["structures"]) == 4
          for structure in report["structures"]:
              assert structure["supportedFrameCount"] == 355
              assert structure["inCropFraction"] >= 0.95
              assert len(structure["frames"]) == 355
          assert report["claims"]["vesselMaskGenerated"] is False
          assert report["claims"]["vesselCenterlineEstablished"] is False
          assert report["targetVeinDisposition"]["superficialTargetVeinAnatomicalId"] is None
          print(json.dumps({
              "registration": report["registration"],
              "structureSummary": [
                  {
                      "draftLabel": s["draftLabel"],
                      "inCropFraction": s["inCropFraction"],
                      "firstPrior": s["frames"][0]["priorCenterSourcePixels"],
                      "lastPrior": s["frames"][-1]["priorCenterSourcePixels"],
                  } for s in report["structures"]
              ],
          }, indent=2))
          PY

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: a06-vessel-atlas-priors-v0
          path: build/vessel-priors/
          compression-level: 9
          retention-days: 30

      - name: Record artifact identity
        run: |
          echo "artifact-id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact-digest=${{ steps.upload.outputs.artifact-digest }}"
