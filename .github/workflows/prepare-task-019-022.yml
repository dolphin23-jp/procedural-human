name: Prepare TASK-019-022

on:
  push:
    branches:
      - task-019-022

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-019-022
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv lock
      - run: uv sync --locked
      - run: pnpm format
      - name: Commit generated lockfile and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock package.json schemas fixtures/schemas tools/validate-schemas.mjs authoring/python/ph_validation
          git commit -m "chore: prepare TASK-019-022 validation"
          git push origin HEAD:task-019-022
