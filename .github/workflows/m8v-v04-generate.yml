name: M8V V04 graph generator

on:
  push:
    branches:
      - m8v-vessel-identification-evidence
    paths:
      - .github/workflows/m8v-v04-generate.yml

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8v-vessel-identification-evidence

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify exact AS06 evidence artifact
        run: |
          mkdir -p build/as06
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10142345368/zip" \
            -o build/as06.zip
          test "$(wc -c < build/as06.zip)" = "46312"
          test "$(sha256sum build/as06.zip | awk '{print $1}')" = "e3cf86361d4d6f4077f42366989c01406e500653366bd96db93fd5a3a8be2e38"
          unzip -q build/as06.zip -d build/as06
          test -f build/as06/as06-upper-extremity-continuity-recon.v0.json
          test -f build/as06/as06-branch-superficial-recon.v0.json
          test "$(sha256sum build/as06/as06-upper-extremity-continuity-recon.v0.json | awk '{print $1}')" = "3fcf80a9b77af8cb444ff47ee8bf76e363dff2f0d5aa79c78f3ad94afb74c423"
          test "$(sha256sum build/as06/as06-branch-superficial-recon.v0.json | awk '{print $1}')" = "a0deb7fcc466598ff4d20eac09126a03f4acef257ccdf9c698fbbe9a95817a99"

      - name: Build V04 source-index candidate vessel graph
        run: |
          python authoring/source-acquisition/m8v_build_candidate_vessel_track_graph.py \
            --phase1 build/as06/as06-upper-extremity-continuity-recon.v0.json \
            --phase2 build/as06/as06-branch-superficial-recon.v0.json \
            --landmark-graph authoring/outputs/m8v-v03-upper-extremity-landmark-graph-20260910.json \
            --artifact-id 10142345368 \
            --artifact-sha256 e3cf86361d4d6f4077f42366989c01406e500653366bd96db93fd5a3a8be2e38 \
            --recorded-at 2026-09-10 \
            --output authoring/outputs/m8v-v04-candidate-vessel-track-graph-20260910.json

      - name: Validate graph invariants
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          record_path = Path('authoring/outputs/m8v-v04-candidate-vessel-track-graph-20260910.json')
          schema_path = Path('schemas/assets/m8v-candidate-vessel-track-graph.v1.schema.json')
          record = json.loads(record_path.read_text())
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(record)
          assert record['gapSummary'] == {
              'trackCount': 17,
              'observationCount': 900,
              'linkCount': 883,
              'explicitGapLinkCount': 133,
              'maxMissingFrameCount': 4,
          }
          assert len(record['branchMergeCandidates']) == 0
          assert len(record['competitorSets'][0]['trackIds']) == 8
          assert len(record['competitorSets'][1]['trackIds']) == 8
          assert record['claims']['radialArteryIdentityEstablished'] is False
          assert record['claims']['superficialVeinClassEstablished'] is False
          assert record['claims']['patientSpaceGeometry'] is False
          print(json.dumps(record['gapSummary'], indent=2))
          PY

      - name: Format generated record and V04 schema
        run: |
          pnpm exec prettier --write \
            schemas/assets/m8v-candidate-vessel-track-graph.v1.schema.json \
            authoring/outputs/m8v-v04-candidate-vessel-track-graph-20260910.json

      - name: Commit deterministic V04 output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/assets/m8v-candidate-vessel-track-graph.v1.schema.json \
            authoring/outputs/m8v-v04-candidate-vessel-track-graph-20260910.json
          git commit -m "TASK-V04: record candidate vessel source-index graph"
          git push origin HEAD:m8v-vessel-identification-evidence
