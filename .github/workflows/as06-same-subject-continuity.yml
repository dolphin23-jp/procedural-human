name: AS06 same-subject upper-extremity continuity

on:
  push:
    branches:
      - task-as06-same-subject-continuity
    paths:
      - '.github/workflows/as06-same-subject-continuity.yml'
      - 'authoring/source-acquisition/as06_upper_extremity_recon.py'
      - 'authoring/source-acquisition/as06_branch_superficial_recon.py'
      - 'authoring/source-archives/vhf-whole-body-inventory-20260910.json'
      - 'authoring/source-archives/vhf-source-archive-index-20260910.json'
      - 'authoring/source-archives/vhf-source-storage-20260910.json'
  workflow_dispatch:

permissions:
  # Draft releases are visible to the workflow token only with push-level
  # repository access. This workflow never mutates release contents.
  contents: write
  actions: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      FIRST_SOURCE: avf1490a.png
      LAST_SOURCE: avf1646a.png

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image-analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            opencv-python-headless==4.12.0.88 \
            Pillow==11.3.0

      - name: Resolve required draft-release asset IDs and verified chunks
        run: |
          mkdir -p build/source-archive
          gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/release-catalog.json
          python - <<'PY' > build/required-chunks.txt
          import json
          import os
          from pathlib import Path

          inventory=json.loads(Path("authoring/source-archives/vhf-whole-body-inventory-20260910.json").read_text())
          storage=json.loads(Path("authoring/source-archives/vhf-source-storage-20260910.json").read_text())
          releases=json.loads(Path("build/release-catalog.json").read_text())
          release=next(
              row for row in releases
              if row["tag_name"] == storage["releaseTag"]
              and row["node_id"] == storage["releaseId"]
          )
          if release["draft"] is not True:
              raise SystemExit("source archive release unexpectedly not draft")

          by_name={row["filename"]:row for row in inventory["frames"]}
          first=by_name[os.environ["FIRST_SOURCE"]]["index"]
          last=by_name[os.environ["LAST_SOURCE"]]["index"]
          needed=sorted({row["chunkIndex"] for row in inventory["frames"][first:last+1]})
          receipts={row["chunk"]["index"]:row for row in storage["receipts"]}
          assets_by_node={row["node_id"]:row for row in release["assets"]}
          if storage["inventorySha256"] != "268a6896b333cf9f1c77d7cf4f97bc838088666385c4a6cec0d36da1129a85d5":
              raise SystemExit("unexpected source storage inventory snapshot")

          for chunk in needed:
              receipt=receipts[chunk]
              asset=assets_by_node[receipt["storage"]["assetId"]]
              if asset["name"] != receipt["chunk"]["filename"]:
                  raise SystemExit("release asset name/receipt mismatch")
              if asset["size"] != receipt["chunk"]["byteSize"]:
                  raise SystemExit("release asset size/receipt mismatch")
              print("|".join([
                  receipt["chunk"]["filename"],
                  str(asset["id"]),
                  str(receipt["chunk"]["byteSize"]),
                  receipt["chunk"]["sha256"],
              ]))
          PY
          echo "required chunks: $(wc -l < build/required-chunks.txt)"
          cut -d '|' -f1 build/required-chunks.txt

      - name: Download immutable source chunks through REST asset endpoint
        run: |
          while IFS='|' read -r asset asset_id byte_size digest; do
            target="build/source-archive/$asset"
            curl --fail --location --silent --show-error \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -o "$target"
            test "$(wc -c < "$target")" = "$byte_size"
            test "$(sha256sum "$target" | awk '{print $1}')" = "$digest"
          done < build/required-chunks.txt

      - name: Download reviewed bounded ulnar artery anchor
        run: |
          mkdir -p build/ulnar-anchor
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10092590748/zip" \
            -o build/ulnar-anchor.zip
          test "$(wc -c < build/ulnar-anchor.zip)" = "80834"
          test "$(sha256sum build/ulnar-anchor.zip | awk '{print $1}')" = "9eadd9a355ebee59eb5dbe59fa0540a227291951f80a9190d4c5f5a5981a7d75"
          unzip -q build/ulnar-anchor.zip -d build/ulnar-anchor
          test -f build/ulnar-anchor/a06-ulnar-continuous-segment-report.v0.json

      - name: Run same-subject proximal continuity reconnaissance
        run: |
          python authoring/source-acquisition/as06_upper_extremity_recon.py \
            --inventory authoring/source-archives/vhf-whole-body-inventory-20260910.json \
            --archive-index authoring/source-archives/vhf-source-archive-index-20260910.json \
            --archive-root build/source-archive \
            --ulnar-report build/ulnar-anchor/a06-ulnar-continuous-segment-report.v0.json \
            --first "$FIRST_SOURCE" \
            --last "$LAST_SOURCE" \
            --output build/as06/as06-upper-extremity-continuity-recon.v0.json

      - name: Validate fail-closed proximal continuity claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("build/as06/as06-upper-extremity-continuity-recon.v0.json").read_text())
          assert report["schema"] == "ph-as06-upper-extremity-continuity-recon.v1"
          assert report["task"] == "TASK-AS06"
          assert report["coordinateSpace"]["kind"] == "source-image-stack"
          assert report["coordinateSpace"]["patientSpaceClaim"] is False
          assert report["source"]["firstSourceFilename"] == "avf1490a.png"
          assert report["source"]["lastSourceFilename"] == "avf1646a.png"
          assert report["anchorLineage"]["anatomicalId"] == "structure.ulnar_artery.left"
          assert report["anchorLineage"]["anchorFrameCount"] == 106
          assert report["boneContinuity"]["earliestSupportedSourceFilename"] == "avf1546a.png"
          assert report["ulnarBridgeSearch"]["reachedBoneTransitionTarget"] is True
          assert report["ulnarBridgeSearch"]["sameSubjectContinuitySupportedToBoneTransition"] is True
          assert report["nextSearchReadiness"]["bifurcationSearchAuthorized"] is True
          assert report["claims"]["radialArteryIdentityEstablished"] is False
          assert report["claims"]["namedSuperficialVeinIdentityEstablished"] is False
          assert report["claims"]["automaticPromotionAllowed"] is False
          assert len(report["source"]["verifiedChunkIndices"]) >= 1
          print(json.dumps({
              "boneContinuity": {
                  k: report["boneContinuity"][k]
                  for k in (
                      "earliestSupportedSourceFilename",
                      "supportedASliceCount",
                      "stopReason",
                      "firstUnsupportedOrAmbiguousSourceFilename",
                      "minimumObservedSeparationPixels",
                  )
              },
              "ulnarBridgeSearch": {
                  k: report["ulnarBridgeSearch"][k]
                  for k in (
                      "bridgeStartSourceFilename",
                      "targetBoneTransitionSourceFilename",
                      "lastObservedSourceFilename",
                      "reachedBoneTransitionTarget",
                      "sameSubjectContinuitySupportedToBoneTransition",
                      "metrics",
                  )
              },
              "nextSearchReadiness": report["nextSearchReadiness"],
          },indent=2))
          PY

      - name: Run anonymous branch-topology and superficial-vessel search
        run: |
          python authoring/source-acquisition/as06_branch_superficial_recon.py \
            --inventory authoring/source-archives/vhf-whole-body-inventory-20260910.json \
            --archive-index authoring/source-archives/vhf-source-archive-index-20260910.json \
            --archive-root build/source-archive \
            --phase1 build/as06/as06-upper-extremity-continuity-recon.v0.json \
            --output build/as06/as06-branch-superficial-recon.v0.json

      - name: Validate fail-closed branch and superficial search claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("build/as06/as06-branch-superficial-recon.v0.json").read_text())
          assert report["schema"] == "ph-as06-branch-superficial-recon.v1"
          assert report["task"] == "TASK-AS06"
          assert report["coordinateSpace"]["kind"] == "source-image-stack"
          assert report["coordinateSpace"]["patientSpaceClaim"] is False
          assert report["arterialBranchTopologySearch"]["knownUlnarContinuityUsedAsAnchor"] is True
          assert report["arterialBranchTopologySearch"]["crossSubjectAtlasUsed"] is False
          assert report["arterialBranchTopologySearch"]["disposition"]["radialArteryIdentityEstablished"] is False
          assert report["superficialVenousSearch"]["namedVeinAtlasUsed"] is False
          assert report["superficialVenousSearch"]["procedureRoleUsedAsIdentity"] is False
          assert report["superficialVenousSearch"]["disposition"]["namedVeinIdentityEstablished"] is False
          assert report["taskDisposition"]["feedForwardToAS07Allowed"] is True
          assert report["taskDisposition"]["automaticMedicalMasterPromotionAllowed"] is False
          assert report["claims"]["automaticPromotionAllowed"] is False
          print(json.dumps({
              "arterialBranchTopologySearch": {
                  "anonymousTrackCount": report["arterialBranchTopologySearch"]["anonymousTrackCount"],
                  "topologyCandidateCount": report["arterialBranchTopologySearch"]["topologyCandidateCount"],
                  "tracks": report["arterialBranchTopologySearch"]["tracks"][:5],
                  "disposition": report["arterialBranchTopologySearch"]["disposition"],
              },
              "superficialVenousSearch": {
                  "anonymousTrackCount": report["superficialVenousSearch"]["anonymousTrackCount"],
                  "continuousAnonymousCandidateCount": report["superficialVenousSearch"]["continuousAnonymousCandidateCount"],
                  "tracks": report["superficialVenousSearch"]["tracks"][:5],
                  "disposition": report["superficialVenousSearch"]["disposition"],
              },
              "taskDisposition": report["taskDisposition"],
          },indent=2))
          PY

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: as06-same-subject-continuity-v0
          path: build/as06/
          compression-level: 9
          retention-days: 30

      - name: Record artifact identity
        run: |
          echo "artifact-id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact-digest=${{ steps.upload.outputs.artifact-digest }}"
