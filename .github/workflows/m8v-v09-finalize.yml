name: M8V V09 identity promotion evaluator finalizer

on:
  push:
    branches:
      - m8v-vessel-identification-evidence
    paths:
      - .github/workflows/m8v-v09-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8v-vessel-identification-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile

      - name: Register TASK-V09 schema and output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/validate-schemas.mjs')
          text = path.read_text()
          if "'m8v-identity-promotion-evaluation'" not in text:
              anchor = "  ['vhf-source-chunk', 'schemas/assets/vhf-source-chunk.v1.schema.json', null],\n"
              addition = """  [
            'm8v-identity-promotion-evaluation',
            'schemas/assets/m8v-identity-promotion-evaluation.v1.schema.json',
            'authoring/outputs/m8v-v09-identity-promotion-evaluation-20260911.json',
          ],
          """.replace('          ', '')
              if anchor not in text:
                  raise SystemExit('validator insertion point not found')
              text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text)
          PY

      - name: Build TASK-V09 promotion evaluation
        run: >-
          python authoring/review/m8v_evaluate_identity_promotion.py
          --ledger authoring/outputs/m8v-v08-evidence-ledger-20260911.json
          --tracks authoring/outputs/m8v-v04-candidate-vessel-track-graph-20260910.json
          --recorded-at 2026-09-11
          --output authoring/outputs/m8v-v09-identity-promotion-evaluation-20260911.json

      - name: Format TASK-V09 artifacts
        run: >-
          pnpm exec prettier --write
          schemas/assets/m8v-identity-promotion-evaluation.v1.schema.json
          authoring/outputs/m8v-v09-identity-promotion-evaluation-20260911.json
          tools/validate-schemas.mjs

      - name: Run TASK-V09 tests
        run: python authoring/source-acquisition/tests/test_m8v_identity_promotion.py

      - name: Re-run TASK-V08 ledger tests
        run: python authoring/source-acquisition/tests/test_m8v_evidence_ledger.py

      - name: Validate schemas
        run: pnpm schema:validate

      - name: Build workspace
        run: pnpm build

      - name: Verify current evidence remains fail-closed
        run: >-
          python -c "import json,pathlib; r=json.loads(pathlib.Path('authoring/outputs/m8v-v09-identity-promotion-evaluation-20260911.json').read_text()); assert r['decision']['state']=='blocked-unresolved'; assert not r['decision']['anyPromotionGatePassed']; assert not r['evaluations']['radialArtery']['promotionGatePassed']; assert not r['evaluations']['superficialStructure']['promotionGatePassed']; assert not r['evaluations']['namedSuperficialVein']['promotionGatePassed']; assert all(r['crossChecks'].values()); assert not r['claims']['medicalValidation']; assert not r['claims']['patientSpaceGeometry']; assert not r['claims']['procedureRoleEstablished']; assert not r['claims']['automaticPromotionAllowed']"

      - name: Mark TASK-V09 complete and TASK-V10 next
        run: |
          python - <<'PY'
          from pathlib import Path

          tasks = Path('TASKS.md')
          text = tasks.read_text()
          old = '''## TASK-V09 — Identity promotion evaluator
          Status: next.
          Implement fail-closed promotion rules for radial-artery identity, subject-scoped superficial-vein structure, and named superficial-vein identity. Every required gate must pass independently; no single scalar confidence may replace required evidence.

          ## TASK-V10 — Feed M8V evidence into M8A
          '''.replace('          ', '')
          new = '''## TASK-V09 — Identity promotion evaluator
          Status: complete / blocked-unresolved — promotion readiness is independently recomputed from claim-level evidence, human-review target consistency, immutable source hashes, and TASK-V04 competitor domains rather than trusting aggregate booleans. Current evidence passes none of the radial, subject-scoped superficial-structure, or named-superficial promotion gates; automatic promotion remains prohibited.

          ## TASK-V10 — Feed M8V evidence into M8A
          Status: next.
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('TASKS V09/V10 status block not found')
          tasks.write_text(text.replace(old, new, 1))

          evidence = Path('authoring/vessel-identification/VESSEL_IDENTIFICATION_EVIDENCE.md')
          text = evidence.read_text()
          old = '''- TASK-V09: next.
          - TASK-V10: not started.
          '''.replace('          ', '')
          new = '''- TASK-V09: complete — see `authoring/outputs/m8v-v09-identity-promotion-evaluation-20260911.json`; readiness is independently recomputed from the 15 claim ledger, immutable upstream hashes, shared reviewed target IDs, and V04 competitor-domain membership. All three promotion targets remain `blocked-unresolved`; no aggregate V08 boolean is accepted without matching claim-level evidence.
          - TASK-V10: next.
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('VESSEL_IDENTIFICATION_EVIDENCE V09 state block not found')
          evidence.write_text(text.replace(old, new, 1))
          PY

      - name: Commit TASK-V09
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/review/m8v_evaluate_identity_promotion.py
          git add authoring/source-acquisition/tests/test_m8v_identity_promotion.py
          git add schemas/assets/m8v-identity-promotion-evaluation.v1.schema.json
          git add authoring/outputs/m8v-v09-identity-promotion-evaluation-20260911.json
          git add tools/validate-schemas.mjs
          git add TASKS.md
          git add authoring/vessel-identification/VESSEL_IDENTIFICATION_EVIDENCE.md
          git commit -m "TASK-V09: finalize fail-closed identity promotion evaluator"
          git push origin HEAD:m8v-vessel-identification-evidence
