name: A09 topology format helper

on:
  push:
    branches:
      - task-a09-ulnar-boundary-lumen-v0
    paths:
      - .github/workflows/a09-topology-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write             authoring/outputs/a08-a09-ulnar-topology-provenance-20260909.json             schemas/assets/a09-boundary-lumen-candidate.v1.schema.json
      - name: Commit exact formatting output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             authoring/outputs/a08-a09-ulnar-topology-provenance-20260909.json             schemas/assets/a09-boundary-lumen-candidate.v1.schema.json
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "chore: format A09 topology records"
            git push
          fi
