name: TASK-063 format capture

on:
  push:
    branches:
      - task-063-oblique-mpr

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and emit files
        run: |
          pnpm exec prettier --write \
            packages/imaging-cornerstone/src/cornerstone-viewer.ts \
            packages/imaging-cornerstone/src/plane.ts \
            packages/session/src/imaging-plane-sync.ts \
            tests/imaging-cornerstone.test.mjs
          for file in \
            packages/imaging-cornerstone/src/cornerstone-viewer.ts \
            packages/imaging-cornerstone/src/plane.ts \
            packages/session/src/imaging-plane-sync.ts \
            tests/imaging-cornerstone.test.mjs
          do
            echo "BEGIN_FILE:${file}"
            base64 -w0 "${file}"
            echo
            echo "END_FILE:${file}"
          done
