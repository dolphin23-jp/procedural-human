name: A06 superficial vessel source discovery

on:
  push:
    branches:
      - task-a06-superficial-vein-source-discovery
    paths:
      - .github/workflows/a06-superficial-vessel-source-discovery.yml
      - authoring/source-acquisition/a06_discover_superficial_vessel_tracks.py
      - schemas/assets/a06-superficial-vessel-source-discovery.v1.schema.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check             numpy==2.2.6             opencv-python-headless==4.12.0.88             Pillow==11.3.0             jsonschema==4.25.1

      - name: Download and verify A05 V0 tissue output
        run: |
          mkdir -p build/a05-output
          curl --fail --location --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10078955143/zip"             -o build/a05-v0.zip
          test "$(wc -c < build/a05-v0.zip)" = "6943149"
          test "$(sha256sum build/a05-v0.zip | awk '{print $1}')" = "6a9f302ab5a1efd5d5d9c60e3c29aeee6b2082f3e04df2bcbe880e886b8b3ef4"
          unzip -q build/a05-v0.zip -d build/a05-output
          test "$(find build/a05-output/masks/skin -name '*.pgm' | wc -l)" = "451"
          test "$(find build/a05-output/masks/subcutaneous_soft_tissue -name '*.pgm' | wc -l)" = "451"

      - name: Download and verify exact A05 source frames
        run: |
          set -euo pipefail
          mkdir -p build/a05-zips build/source
          ids=(10057281755 10057282711 10057283651 10057284584 10057285605 10057286644 10057287687 10057288822 10057289930 10057291004)
          sizes=(26031165 25803357 25331225 25451281 25368674 25100034 25140770 25076645 25408260 20650491)
          hashes=(
            78b1b2c1e1ffa006f3b07711e3497bb74ba7133f777709eebcd008b1b429623d
            01d54d17761091fc576e8cb7acb47bfc5b178185ffadb50415ff806bdfd7c837
            56e2c3cb8382a4b6eb96fa4c04e12793281f8214a48fe5880c36628508663352
            8577b8e831bfd7d6d590562bd4c2603d9ca0e455179c426ac4860f05f517b44c
            f912d7e745e3d817c555f8ea223b9bd1c5c07a52932f5a94464a3de215845816
            4e702ab792ebd6af5aaff975221344c0b8e5a11feb9c89d33b42268dc01c5372
            d5ecf42796bdf1a20d6540b49a2e5992524d5e85ba25bfc60245ab734f3e073f
            d0ba39a31449fac6754e9999051ad463b3a9ec39b62365568741623f20cd78c7
            316aff6722ca56c67d8ea4bde02e613501190849e24bcdc3eafe3621cc944a2e
            91c11d65506128cad36a2ba70284b154ee07811bbf3dc8674dceeb8cbd2aae63
          )
          for i in $(seq 0 9); do
            curl --fail --location --silent --show-error               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${ids[$i]}/zip"               -o "build/a05-zips/chunk-$i.zip"
            test "$(wc -c < "build/a05-zips/chunk-$i.zip")" = "${sizes[$i]}"
            test "$(sha256sum "build/a05-zips/chunk-$i.zip" | awk '{print $1}')" = "${hashes[$i]}"
            unzip -q -o "build/a05-zips/chunk-$i.zip" -d build/source
          done
          test "$(find build/source -maxdepth 1 -name 'avf*.png' | wc -l)" = "451"

      - name: Discover direct source-image superficial vessel tracks
        run: |
          python authoring/source-acquisition/a06_discover_superficial_vessel_tracks.py             --source-root build/source             --a05-root build/a05-output             --output-root build/discovery

      - name: Validate discovery report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report=json.loads(Path("build/discovery/a06-superficial-vessel-source-discovery.v0.json").read_text())
          schema=json.loads(Path("schemas/assets/a06-superficial-vessel-source-discovery.v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(report)

          assert report["candidateStatistics"]["frameCount"] == 451
          assert report["searchDefinition"]["atlasPriorUsed"] is False
          assert report["searchDefinition"]["namedVeinIdentityUsed"] is False
          assert report["disposition"]["targetIdentityEstablished"] is False
          assert report["disposition"]["maskGenerationAllowed"] is False
          assert report["claims"]["vesselMaskGenerated"] is False
          assert report["claims"]["centerlineGenerated"] is False
          assert len(report["tracks"]) <= 5

          print(json.dumps({
              "candidateStatistics": report["candidateStatistics"],
              "tracks": [
                  {
                      key: track[key]
                      for key in (
                          "rank",
                          "discoveryClassification",
                          "nodeCount",
                          "spanFrameCount",
                          "coverageFraction",
                          "firstSourceFilename",
                          "lastSourceFilename",
                          "meanJumpSourcePixels",
                          "maxJumpSourcePixels",
                          "medianAreaPixels",
                          "medianCircularity",
                          "medianContrast",
                          "medianSkinDepthPixels",
                      )
                  }
                  for track in report["tracks"]
              ],
          },indent=2))
          PY

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: a06-superficial-vessel-source-discovery-v0
          path: build/discovery/
          compression-level: 9
          retention-days: 30

      - name: Record artifact identity
        run: |
          echo "artifact-id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact-digest=${{ steps.upload.outputs.artifact-digest }}"
