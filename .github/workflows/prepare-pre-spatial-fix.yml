name: Prepare pre-spatial corrective fix

on:
  push:
    branches:
      - fix-pre-spatial-foundation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pre-spatial-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write packages/anatomy/src/index.ts packages/patient/src/index.ts tests/patient-domain.test.mjs tools/check-package-boundaries.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/anatomy/src/index.ts packages/patient/src/index.ts tests/patient-domain.test.mjs tools/check-package-boundaries.test.mjs
          git commit -m "chore: format pre-spatial corrective fix"
          git push origin HEAD:fix-pre-spatial-foundation
