name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true

      - run: uv sync --locked

      - run: pnpm lint
      - name: TASK-A05 temporary schema format capture
        run: |
          pnpm exec prettier --write schemas/assets/draft-segmentation-manifest.v1.schema.json schemas/assets/source-archive-record.v1.schema.json schemas/assets/vascular-feasibility-report.v1.schema.json
          echo '=== DRAFT_SCHEMA ==='
          cat schemas/assets/draft-segmentation-manifest.v1.schema.json
          echo '=== SOURCE_ARCHIVE_SCHEMA ==='
          cat schemas/assets/source-archive-record.v1.schema.json
          echo '=== VASCULAR_SCHEMA ==='
          cat schemas/assets/vascular-feasibility-report.v1.schema.json
          echo '=== END_TASK_A05_SCHEMAS ==='
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm spatial:baseline
      - run: pnpm build
