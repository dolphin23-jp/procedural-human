name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true

      - run: uv sync --locked

      - run: pnpm lint
      - run: pnpm format

      - name: Commit generated lockfile and formatting
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web/src/App.tsx apps/web/src/styles.css packages/imaging-cornerstone tests/imaging-cornerstone.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "chore: update lockfile and format TASK-058/059"
            git push
          fi

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm spatial:baseline
      - run: pnpm build
