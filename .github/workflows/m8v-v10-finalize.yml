name: M8V V10 M8A feed-forward finalizer

on:
  push:
    branches:
      - m8v-vessel-identification-evidence
    paths:
      - .github/workflows/m8v-v10-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8v-vessel-identification-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Register TASK-V10 schema and output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/validate-schemas.mjs')
          text = path.read_text()
          if "'m8v-m8a-feed-forward'" not in text:
              anchor = "  ['vhf-source-chunk', 'schemas/assets/vhf-source-chunk.v1.schema.json', null],\n"
              addition = """  [
            'm8v-m8a-feed-forward',
            'schemas/assets/m8v-m8a-feed-forward.v1.schema.json',
            'authoring/outputs/m8v-v10-m8a-feed-forward-20260911.json',
          ],
          """.replace('          ', '')
              if anchor not in text:
                  raise SystemExit('validator insertion point not found')
              text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text)
          PY

      - name: Build TASK-V10 feed-forward record
        run: >-
          python authoring/review/m8v_feed_promotion_to_m8a.py
          --v09 authoring/outputs/m8v-v09-identity-promotion-evaluation-20260911.json
          --as07 authoring/outputs/as07-continuity-feed-forward-20260910.json
          --a07 authoring/semantic/a07-semantic-structure-mapping-20260910.json
          --a08 authoring/outputs/a08-vessel-centerline-authoring-report-20260910.json
          --a09 authoring/outputs/a09-boundary-lumen-authoring-report-20260910.json
          --a10 authoring/outputs/a10-medical-master-readiness-20260910.json
          --recorded-at 2026-09-11
          --output authoring/outputs/m8v-v10-m8a-feed-forward-20260911.json

      - name: Format TASK-V10 artifacts
        run: >-
          pnpm exec prettier --write
          schemas/assets/m8v-m8a-feed-forward.v1.schema.json
          authoring/outputs/m8v-v10-m8a-feed-forward-20260911.json
          tools/validate-schemas.mjs

      - name: Run TASK-V10 tests
        run: python authoring/source-acquisition/tests/test_m8v_m8a_feed_forward.py

      - name: Re-run TASK-V09 tests
        run: python authoring/source-acquisition/tests/test_m8v_identity_promotion.py

      - name: Re-run TASK-V08 tests
        run: python authoring/source-acquisition/tests/test_m8v_evidence_ledger.py

      - name: Validate schemas
        run: pnpm schema:validate

      - name: Build workspace
        run: pnpm build

      - name: Verify Gate V closes fail-closed without creating anatomy
        run: >-
          python -c "import json,pathlib; r=json.loads(pathlib.Path('authoring/outputs/m8v-v10-m8a-feed-forward-20260911.json').read_text()); assert r['gateV']['status']=='complete'; assert r['gateV']['outcome']=='fail-closed-documented'; assert r['a10Reevaluation']['status']=='blocked'; assert not r['a10Reevaluation']['medicalMasterCreationAllowed']; assert not r['promotionInput']['anyPromotionGatePassed']; assert not r['claims']['newRadialIdentityApplied']; assert not r['claims']['newSuperficialStructureIdentityApplied']; assert not r['claims']['newNamedSuperficialVeinIdentityApplied']; assert not r['claims']['newGeometryPromoted']; assert r['claims']['existingUlnarEvidencePreserved']; assert not r['claims']['medicalMasterCreated']; assert not r['claims']['medicalValidation']; assert not r['claims']['patientSpaceGeometry']; assert not r['claims']['procedureRoleUsedAsAnatomicalIdentity']; assert not r['claims']['automaticPromotionAllowed']"

      - name: Mark TASK-V10 and Gate V complete
        run: |
          python - <<'PY'
          from pathlib import Path

          tasks = Path('TASKS.md')
          text = tasks.read_text()
          start = text.index('## TASK-V10 — Feed M8V evidence into M8A')
          end = text.index('\n# M8A — Medical Asset Authoring Lane', start)
          replacement = '''## TASK-V10 — Feed M8V evidence into M8A
          Status: complete / fail-closed-documented — see `authoring/outputs/m8v-v10-m8a-feed-forward-20260911.json`. TASK-V09 passed no radial, subject-scoped superficial-structure, or named-superficial promotion gate, so no new identity or geometry was injected into A07/A08/A09. Existing bounded ulnar evidence is preserved, TASK-A10 remains blocked, and the unresolved source limitations are explicitly fed back into M8A provenance.
          Feed only passed claims and representations into A06/A07/A08/A09 and reevaluate A10. Preserve historical evidence and valid ulnar work. Identity eligibility never fabricates A08/A09 geometry or Medical Master readiness.

          Gate V after TASK-V10: complete / fail-closed-documented — TASK-V01 through TASK-V10 are complete. Promotion criteria are explicit and independently evaluated; current radial and superficial identities remain unresolved, no anatomy was fabricated, and TASK-A10 was re-evaluated and remains blocked pending stronger same-subject evidence and explicit human anatomical review.
          '''.replace('          ', '')
          tasks.write_text(text[:start] + replacement + text[end:])

          evidence = Path('authoring/vessel-identification/VESSEL_IDENTIFICATION_EVIDENCE.md')
          text = evidence.read_text()
          old = '- TASK-V10: next.'
          new = '- TASK-V10: complete — see `authoring/outputs/m8v-v10-m8a-feed-forward-20260911.json`; no V09 promotion gate passed, so radial/superficial identities and geometry remain blocked, existing bounded ulnar work is preserved, and A10 remains blocked. Gate V is complete as a fail-closed evidence-lane result, not as anatomical identity success.'
          if old not in text:
              raise SystemExit('VESSEL_IDENTIFICATION_EVIDENCE V10 state block not found')
          evidence.write_text(text.replace(old, new, 1))
          PY

      - name: Commit TASK-V10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/review/m8v_feed_promotion_to_m8a.py
          git add authoring/source-acquisition/tests/test_m8v_m8a_feed_forward.py
          git add schemas/assets/m8v-m8a-feed-forward.v1.schema.json
          git add authoring/outputs/m8v-v10-m8a-feed-forward-20260911.json
          git add tools/validate-schemas.mjs
          git add TASKS.md
          git add authoring/vessel-identification/VESSEL_IDENTIFICATION_EVIDENCE.md
          git commit -m "TASK-V10: feed M8V evidence into M8A fail-closed"
          git push origin HEAD:m8v-vessel-identification-evidence
