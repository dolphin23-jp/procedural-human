name: A05 format helper

on:
  push:
    branches:
      - task-a05-current-main-forward-port
    paths:
      - .github/workflows/a05-format-helper.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write authoring/manual-inputs/a05-real-source-visual-inspection-20260909.json authoring/source-archives/a05-real-source-verification-20260909.json
      - uses: actions/upload-artifact@v4
        with:
          name: a05-prettier-output
          path: |
            authoring/manual-inputs/a05-real-source-visual-inspection-20260909.json
            authoring/source-archives/a05-real-source-verification-20260909.json
          retention-days: 1
