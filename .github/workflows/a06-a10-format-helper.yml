name: A06-A10 format helper

on:
  push:
    branches:
      - task-a06-a08-review-semantic-centerline-gates
    paths:
      - .github/workflows/a06-a10-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write schemas/assets/manual-edit-provenance.v1.schema.json schemas/assets/semantic-structure-mapping.v1.schema.json
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/assets/manual-edit-provenance.v1.schema.json schemas/assets/semantic-structure-mapping.v1.schema.json
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "chore: format A06-A07 authoring schemas"
            git push
          fi
