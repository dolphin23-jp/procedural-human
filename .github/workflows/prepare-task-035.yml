name: Prepare TASK-035

on:
  push:
    branches:
      - task-035-spatial-adapter

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-035-spatial-adapter
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm prettier --write package.json packages/spatial/package.json packages/spatial/src/index.ts packages/spatial/tsconfig.json tests/spatial-contract.test.mjs tools/check-package-boundaries.mjs tools/check-package-boundaries.test.mjs
      - name: Commit preparation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml packages/spatial/package.json packages/spatial/src/index.ts packages/spatial/tsconfig.json tests/spatial-contract.test.mjs tools/check-package-boundaries.mjs tools/check-package-boundaries.test.mjs
          git commit -m "chore: prepare TASK-035 contracts"
          git push origin HEAD:task-035-spatial-adapter
