name: Prepare TASK-028-034

on:
  push:
    branches:
      - task-028-034

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-028-034
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit generated lockfile and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml packages/anatomy packages/patient packages/physiology fixtures/anatomy tests/anatomy.test.mjs tests/patient-domain.test.mjs
          git commit -m "chore: prepare TASK-028-034 validation"
          git push origin HEAD:task-028-034
